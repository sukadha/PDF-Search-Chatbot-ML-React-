<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>PDF Chatbot</h2>

        <!-- PDF Upload Form -->
        <input type="file" id="pdfFile">
        <button onclick="uploadPDF()">Upload</button>
        <p id="uploadStatus"></p>

        <!-- Chatbot Interface -->
        <div id="chatbox">
            <p><strong>ChatBot:</strong> Upload a PDF and ask a question!</p>
        </div>

        <input type="text" id="query" placeholder="Ask something...">
        <button onclick="searchQuery()">Search</button>
    </div>

    <script>
        let extractedText = "";

        function uploadPDF() {
            let fileInput = document.getElementById("pdfFile");
            let file = fileInput.files[0];

            if (!file) {
                alert("Please select a file!");
                return;
            }

            let formData = new FormData();
            formData.append("pdf_file", file);

            fetch("/upload", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.text) {
                    extractedText = data.text;
                    document.getElementById("uploadStatus").innerText = "PDF Uploaded Successfully!";
                } else {
                    document.getElementById("uploadStatus").innerText = "Upload Failed!";
                }
            });
        }

        function searchQuery() {
            let query = document.getElementById("query").value.trim();
            if (!query || !extractedText) {
                alert("Upload a PDF and enter a query!");
                return;
            }

            fetch("/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query, text: extractedText })
            })
            .then(response => response.json())
            .then(data => {
                let chatbox = document.getElementById("chatbox");
                chatbox.innerHTML += `<p><strong>You:</strong> ${query}</p>`;
                chatbox.innerHTML += `<p><strong>ChatBot:</strong> ${data.response}</p>`;
            });
        }
    </script>
</body>
</html>
